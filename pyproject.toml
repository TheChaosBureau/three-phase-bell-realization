[project]
name = "three-phase-bell-realization"
version = "0.1.0"
description = "Interactive pedagogical paper relating three-phase power systems to quantum entanglement"
authors = [
    {name = "David",email = "david.nobles@sontric.org"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.5.2,<8.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "ipympl (>=0.10.0,<0.11.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "allure-pytest (>=2.15.3,<3.0.0)",
    "pyspice (>=1.5,<2.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
