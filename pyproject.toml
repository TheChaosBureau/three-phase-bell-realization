[project]
name = "three-phase-entanglement"
version = "0.1.0"
description = "Interactive pedagogical paper relating three-phase power systems to quantum entanglement"
authors = [
    {name = "David",email = "david.nobles@sontric.org"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.5.2,<8.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
