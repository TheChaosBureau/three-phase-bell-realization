name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short commit hash
        run: echo "GIT_SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Run test suite in Nix dev shell
        run: nix develop --command make test

      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html-${{ env.GIT_SHORT_SHA }}
          path: artifacts/tests/allure-report/index_${{ env.GIT_SHORT_SHA }}.html
          if-no-files-found: warn
